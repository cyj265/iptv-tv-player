<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="setpanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(15,17,20,0.97)"/>
      <stop offset="100%" stop-color="rgba(15,17,20,0.9)"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="540" fill="#1a1d23"/>
  <circle cx="200" cy="300" r="180" fill="#3a2a4a" opacity="0.08"/>

  <!-- 设置面板（右侧弹出） -->
  <rect x="240" y="0" width="720" height="540" fill="url(#setpanel)"/>

  <!-- 顶部标题 -->
  <rect x="240" y="0" width="720" height="56" fill="rgba(0,0,0,0.4)"/>
  <text x="264" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">设置</text>
  <text x="936" y="36" font-family="sans-serif" font-size="13" fill="#8892a0" text-anchor="end">揽星TV v1.8.8</text>

  <!-- 左栏：导航 -->
  <rect x="240" y="56" width="180" height="484" fill="rgba(0,0,0,0.2)"/>

  <!-- 导航项：直播源（选中） -->
  <rect x="248" y="72" width="164" height="44" rx="6" fill="#3D8BFF"/>
  <text x="272" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">直播源</text>

  <!-- 导航项：播放设置 -->
  <rect x="248" y="124" width="164" height="44" rx="6" fill="transparent"/>
  <text x="272" y="152" font-family="sans-serif" font-size="15" fill="#c0c8d8">播放设置</text>

  <!-- 导航项：偏好设置 -->
  <rect x="248" y="176" width="164" height="44" rx="6" fill="transparent"/>
  <text x="272" y="204" font-family="sans-serif" font-size="15" fill="#c0c8d8">偏好设置</text>

  <!-- 导航项：调试设置 -->
  <rect x="248" y="228" width="164" height="44" rx="6" fill="transparent"/>
  <text x="272" y="256" font-family="sans-serif" font-size="15" fill="#c0c8d8">调试设置</text>

  <!-- 导航项：关于 -->
  <rect x="248" y="280" width="164" height="44" rx="6" fill="transparent"/>
  <text x="272" y="308" font-family="sans-serif" font-size="15" fill="#c0c8d8">关于</text>

  <!-- 右栏：直播源内容 -->
  <text x="444" y="88" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">直播源管理</text>
  <text x="444" y="108" font-family="sans-serif" font-size="12" fill="#6a7280">支持多个直播源，可在播放时切换</text>

  <!-- 直播源列表 -->
  <!-- 源1（当前选中） -->
  <rect x="440" y="124" width="500" height="64" rx="8" fill="rgba(61,139,255,0.12)"/>
  <rect x="440" y="124" width="4" height="64" rx="2" fill="#3D8BFF"/>
  <circle cx="464" cy="148" r="5" fill="#3D8BFF"/>
  <text x="480" y="152" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">甘肃移动</text>
  <text x="480" y="174" font-family="sans-serif" font-size="12" fill="#8892a0">https://cdn.jsdelivr.net/gh/cyj265/iptv@main/gansu.m3u</text>
  <text x="920" y="152" font-family="sans-serif" font-size="11" fill="#3D8BFF" text-anchor="end">当前</text>
  <text x="920" y="174" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">118 频道</text>

  <!-- 源2 -->
  <rect x="440" y="196" width="500" height="56" rx="8" fill="rgba(255,255,255,0.03)"/>
  <circle cx="464" cy="224" r="5" fill="rgba(255,255,255,0.2)"/>
  <text x="480" y="224" font-family="sans-serif" font-size="14" fill="#e0e4ec">备用源1</text>
  <text x="480" y="244" font-family="sans-serif" font-size="11" fill="#6a7280">http://example.com/playlist2.m3u</text>
  <text x="920" y="234" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">96 频道</text>

  <!-- 添加按钮 -->
  <rect x="440" y="260" width="500" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="690" y="288" font-family="sans-serif" font-size="14" fill="#8892a0" text-anchor="middle">+ 添加直播源（URL / 本地文件 / 扫码）</text>

  <!-- 节目指南 -->
  <text x="444" y="332" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">节目指南 (EPG)</text>
  <rect x="440" y="344" width="500" height="48" rx="8" fill="rgba(255,255,255,0.03)"/>
  <text x="460" y="366" font-family="sans-serif" font-size="13" fill="#e0e4ec">EPG 地址</text>
  <text x="460" y="384" font-family="sans-serif" font-size="11" fill="#6a7280">https://epg.example.com/guide.xml</text>

  <!-- 底部操作提示 -->
  <rect x="240" y="500" width="720" height="40" fill="rgba(0,0,0,0.5)"/>
  <text x="264" y="525" font-family="sans-serif" font-size="12" fill="#6a7280">↑↓ 切换选项</text>
  <text x="380" y="525" font-family="sans-serif" font-size="12" fill="#6a7280">←→ 切换导航</text>
  <text x="500" y="525" font-family="sans-serif" font-size="12" fill="#6a7280">OK 确认/编辑</text>
  <text x="640" y="525" font-family="sans-serif" font-size="12" fill="#6a7280">菜单 关闭</text>
</svg>
