<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(15,17,20,0.97)"/>
      <stop offset="100%" stop-color="rgba(15,17,20,0.85)"/>
    </linearGradient>
  </defs>

  <!-- 背景（半透明视频画面） -->
  <rect width="960" height="540" fill="#1a1d23"/>
  <circle cx="750" cy="250" r="200" fill="#2a3a5a" opacity="0.1"/>

  <!-- 频道列表面板 -->
  <rect x="0" y="0" width="720" height="540" fill="url(#panel)"/>

  <!-- 顶部标题栏 -->
  <rect x="0" y="0" width="720" height="56" fill="rgba(0,0,0,0.4)"/>
  <text x="24" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">频道列表</text>
  <text x="696" y="36" font-family="sans-serif" font-size="13" fill="#8892a0" text-anchor="end">甘肃移动 · 118 个频道</text>

  <!-- 左栏：分组 -->
  <rect x="0" y="56" width="160" height="484" fill="rgba(0,0,0,0.2)"/>
  <text x="16" y="86" font-family="sans-serif" font-size="12" fill="#6a7280">分组</text>

  <!-- 分组项：央视（选中） -->
  <rect x="8" y="96" width="144" height="40" rx="6" fill="#3D8BFF"/>
  <text x="28" y="122" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">央视</text>
  <text x="136" y="122" font-family="sans-serif" font-size="11" fill="#cce0ff" text-anchor="end">32</text>

  <!-- 分组项：卫视 -->
  <rect x="8" y="144" width="144" height="40" rx="6" fill="transparent"/>
  <text x="28" y="170" font-family="sans-serif" font-size="15" fill="#c0c8d8">卫视</text>
  <text x="136" y="170" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">28</text>

  <!-- 分组项：地方 -->
  <rect x="8" y="192" width="144" height="40" rx="6" fill="transparent"/>
  <text x="28" y="218" font-family="sans-serif" font-size="15" fill="#c0c8d8">地方</text>
  <text x="136" y="218" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">36</text>

  <!-- 分组项：数字 -->
  <rect x="8" y="240" width="144" height="40" rx="6" fill="transparent"/>
  <text x="28" y="266" font-family="sans-serif" font-size="15" fill="#c0c8d8">数字</text>
  <text x="136" y="266" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">12</text>

  <!-- 分组项：广播 -->
  <rect x="8" y="288" width="144" height="40" rx="6" fill="transparent"/>
  <text x="28" y="314" font-family="sans-serif" font-size="15" fill="#c0c8d8">广播</text>
  <text x="136" y="314" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">10</text>

  <!-- 中栏：频道列表 -->
  <text x="184" y="86" font-family="sans-serif" font-size="12" fill="#6a7280">频道</text>

  <!-- 频道项：CCTV1（选中，正在播放） -->
  <rect x="176" y="96" width="280" height="48" rx="6" fill="#3D8BFF"/>
  <circle cx="196" cy="120" r="6" fill="#e74c3c"/>
  <text x="212" y="118" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">CCTV-1 综合</text>
  <text x="212" y="136" font-family="sans-serif" font-size="11" fill="#cce0ff">新闻联播 · 19:00</text>
  <text x="444" y="126" font-family="sans-serif" font-size="11" fill="#cce0ff" text-anchor="end">HD</text>

  <!-- 频道项：CCTV2 -->
  <rect x="176" y="152" width="280" height="48" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="212" y="174" font-family="sans-serif" font-size="15" fill="#e0e4ec">CCTV-2 财经</text>
  <text x="212" y="192" font-family="sans-serif" font-size="11" fill="#6a7280">经济半小时 · 20:00</text>
  <text x="444" y="182" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">HD</text>

  <!-- 频道项：CCTV3 -->
  <rect x="176" y="208" width="280" height="48" rx="6" fill="transparent"/>
  <text x="212" y="230" font-family="sans-serif" font-size="15" fill="#e0e4ec">CCTV-3 综艺</text>
  <text x="212" y="248" font-family="sans-serif" font-size="11" fill="#6a7280">综艺盛典 · 21:00</text>
  <text x="444" y="238" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">HD</text>

  <!-- 频道项：CCTV5 -->
  <rect x="176" y="264" width="280" height="48" rx="6" fill="transparent"/>
  <text x="212" y="286" font-family="sans-serif" font-size="15" fill="#e0e4ec">CCTV-5 体育</text>
  <text x="212" y="304" font-family="sans-serif" font-size="11" fill="#6a7280">体育新闻 · 18:00</text>
  <text x="444" y="294" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">HD</text>

  <!-- 频道项：CCTV6 -->
  <rect x="176" y="320" width="280" height="48" rx="6" fill="transparent"/>
  <text x="212" y="342" font-family="sans-serif" font-size="15" fill="#e0e4ec">CCTV-6 电影</text>
  <text x="212" y="360" font-family="sans-serif" font-size="11" fill="#6a7280">佳片有约 · 22:00</text>
  <text x="444" y="350" font-family="sans-serif" font-size="11" fill="#6a7280" text-anchor="end">HD</text>

  <!-- 右栏：节目信息 -->
  <rect x="472" y="56" width="248" height="484" fill="rgba(0,0,0,0.15)"/>
  <text x="492" y="86" font-family="sans-serif" font-size="12" fill="#6a7280">节目信息</text>

  <!-- 当前节目 -->
  <rect x="488" y="96" width="216" height="80" rx="8" fill="rgba(61,139,255,0.12)"/>
  <rect x="488" y="96" width="4" height="80" rx="2" fill="#3D8BFF"/>
  <text x="504" y="120" font-family="sans-serif" font-size="11" fill="#3D8BFF">正在播放</text>
  <text x="504" y="144" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">新闻联播</text>
  <text x="504" y="164" font-family="sans-serif" font-size="12" fill="#8892a0">19:00 - 19:30 (30分钟)</text>

  <!-- 节目单 -->
  <text x="492" y="200" font-family="sans-serif" font-size="12" fill="#6a7280">节目单</text>

  <rect x="488" y="210" width="216" height="44" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="504" y="230" font-family="sans-serif" font-size="13" fill="#e0e4ec">天气预报</text>
  <text x="504" y="248" font-family="sans-serif" font-size="11" fill="#6a7280">19:30 - 19:35</text>

  <rect x="488" y="260" width="216" height="44" rx="6" fill="transparent"/>
  <text x="504" y="280" font-family="sans-serif" font-size="13" fill="#e0e4ec">焦点访谈</text>
  <text x="504" y="298" font-family="sans-serif" font-size="11" fill="#6a7280">19:35 - 20:00</text>

  <rect x="488" y="310" width="216" height="44" rx="6" fill="transparent"/>
  <text x="504" y="330" font-family="sans-serif" font-size="13" fill="#e0e4ec">电视剧</text>
  <text x="504" y="348" font-family="sans-serif" font-size="11" fill="#6a7280">20:00 - 22:00</text>

  <!-- 底部操作提示 -->
  <rect x="0" y="500" width="720" height="40" fill="rgba(0,0,0,0.5)"/>
  <text x="24" y="525" font-family="sans-serif" font-size="12" fill="#6a7280">↑↓ 切换频道</text>
  <text x="160" y="525" font-family="sans-serif" font-size="12" fill="#6a7280">←→ 切换分组</text>
  <text x="300" y="525" font-family="sans-serif" font-size="12" fill="#6a7280">OK 播放</text>
  <text x="400" y="525" font-family="sans-serif" font-size="12" fill="#6a7280">返回 关闭</text>
</svg>
