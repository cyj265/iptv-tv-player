<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.85)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <linearGradient id="bottombar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)"/>
    </linearGradient>
  </defs>

  <!-- 背景（模拟视频画面） -->
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="720" cy="200" r="180" fill="#2a3a5a" opacity="0.15"/>
  <circle cx="200" cy="400" r="140" fill="#3a2a4a" opacity="0.1"/>

  <!-- 顶部信息栏 -->
  <rect x="0" y="0" width="960" height="72" fill="url(#topbar)"/>
  <text x="32" y="44" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">CCTV-1 综合</text>
  <text x="32" y="64" font-family="sans-serif" font-size="13" fill="#a0a8b8">线路一 · 1080P · HEVC</text>
  <text x="928" y="44" font-family="sans-serif" font-size="18" fill="#a0a8b8" text-anchor="end">20:30</text>

  <!-- 底部节目信息 -->
  <rect x="0" y="468" width="960" height="72" fill="url(#bottombar)"/>
  <rect x="32" y="488" width="4" height="32" rx="2" fill="#3D8BFF"/>
  <text x="48" y="508" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">新闻联播</text>
  <text x="48" y="528" font-family="sans-serif" font-size="12" fill="#8892a0">19:00 - 19:30</text>
  <text x="220" y="508" font-family="sans-serif" font-size="14" fill="#a0a8b8">下一个：</text>
  <text x="280" y="508" font-family="sans-serif" font-size="14" fill="#c0c8d8">天气预报</text>
  <text x="280" y="528" font-family="sans-serif" font-size="12" fill="#8892a0">19:30 - 19:35</text>

  <!-- 右上角 LIVE 标识 -->
  <rect x="870" y="56" width="58" height="22" rx="4" fill="#e74c3c"/>
  <text x="899" y="72" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">LIVE</text>
</svg>
