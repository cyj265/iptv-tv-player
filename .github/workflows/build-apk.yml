name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定 debug 签名：优先级 仓库内 b64 文件 > actions 缓存 > 首次生成。
      # 仓库内 .github/debug-keystore.b64 一旦存在且有效，签名永久不变，新版本必然可覆盖安装。
      # 注意：必须用 keytool 验证（密码 android + alias androiddebugkey），
      # 否则 Gradle 打不开会静默自动生成新 keystore，导致每次构建签名都变、无法覆盖安装。
      - name: Cache Android debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Restore or generate debug keystore
        id: keystore-setup
        run: |
          mkdir -p ~/.android
          if [ -f .github/debug-keystore.b64 ]; then
            base64 -d .github/debug-keystore.b64 > ~/.android/debug.keystore
            if keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "source=repo-file"
            else
              echo "repo keystore invalid, regenerating"
              keytool -genkeypair -v -keystore ~/.android/debug.keystore \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "source=repo-file-invalid-regenerated"
            fi
          elif [ -f ~/.android/debug.keystore ]; then
            echo "source=cache"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "source=generated"
          fi

      - name: Export debug keystore as base64 asset
        run: |
          base64 -w0 ~/.android/debug.keystore > debug-keystore.b64

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$status" >> $GITHUB_ENV
          exit 0

      - name: Publish build log on failure
        if: env.BUILD_EXIT != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp build.log build-errors.txt
          git add build-errors.txt
          git commit -m "chore: publish build errors" || true
          git push origin HEAD:main || true

      - name: Fail job on build error
        if: env.BUILD_EXIT != '0'
        run: exit 1

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/iptv-player-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: dist/*.apk
          retention-days: 30

      - name: Auto tag release version
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          TAG="v$(grep versionName app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.apk
            debug-keystore.b64
          generate_release_notes: true

      # 清理 Release 旧资产：只保留本次构建的 APK 与 keystore b64，避免资产越堆越多
      - name: Clean old release assets
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR="iptv-player-v${{ github.run_number }}.apk"
          for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            if [ "$asset" != "$CUR" ] && [[ "$asset" != *.b64 ]]; then
              gh release delete-asset "$TAG" "$asset" --yes || true
            fi
          done
