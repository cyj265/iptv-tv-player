name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定 debug 签名：缓存 ~/.android/debug.keystore，保证所有构建使用同一签名，
      # 新版本才能覆盖安装旧版本（否则每次构建签名都不同，必须卸载重装）。
      - name: Cache Android debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Generate fixed debug keystore (first build only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$status" >> $GITHUB_ENV
          exit 0

      - name: Publish build log on failure
        if: env.BUILD_EXIT != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp build.log build-errors.txt
          git add build-errors.txt
          git commit -m "chore: publish build errors" || true
          git push origin HEAD:main || true

      - name: Fail job on build error
        if: env.BUILD_EXIT != '0'
        run: exit 1

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/iptv-player-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: dist/*.apk
          retention-days: 30

      - name: Auto tag release version
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          TAG="v$(grep versionName app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.apk
          generate_release_notes: true

      # 清理 Release 旧资产：只保留本次构建的 APK，避免资产越堆越多
      - name: Clean old release assets
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR="iptv-player-v${{ github.run_number }}.apk"
          for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
            if [ "$asset" != "$CUR" ]; then
              gh release delete-asset "$TAG" "$asset" --yes || true
            fi
          done
